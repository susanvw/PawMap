# Render Blueprint: https://render.com/docs/blueprint-spec
# Create the service from this file in the Render dashboard (New > Blueprint),
# then fill in the two secret env vars when prompted.
services:
  - type: web
    name: pawmap-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Neon connection string, e.g. postgresql://user:pass@ep-xxx.neon.tech/pawmap?sslmode=require
      - key: DATABASE_URL
        sync: false
      # From the Cloudinary dashboard: cloudinary://<api_key>:<api_secret>@<cloud_name>
      - key: CLOUDINARY_URL
        sync: false
